<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift (dev harness)</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body style="background: #3a5f7d linear-gradient(135deg, #d9dee6, #5b7a99)">
    <main id="stage" data-state="idle">
      <section id="card" class="card" aria-live="polite"></section>
      <div id="voice" class="voice">
        <div id="orb" class="orb"><div class="orb-core"></div><div class="orb-ring"></div></div>
        <p id="transcript" class="transcript"></p>
      </div>
    </main>
    <!-- Dev only: drive a debug backend without a microphone (ADR-010: the email demo and "show me"). -->
    <aside id="dev" style="position: fixed; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; font: 12px system-ui">
      <button data-send='["debug.run", {"scenario": "email"}]'>Email demo</button>
      <button data-send='["debug.say", {"text": "show me"}]'>Say “show me”</button>
      <button data-send='["debug.say", {"text": "show me the recipient"}]'>Say “show the recipient”</button>
      <button data-send='["debug.say", {"text": "hide that"}]'>Say “hide that”</button>
      <button data-send='["debug.say", {"text": "approve"}]'>Say “approve”</button>
      <button data-send='["debug.say", {"text": "stop"}]'>Say “stop”</button>
    </aside>
    <script type="module">
      document.getElementById("dev").addEventListener("click", (ev) => {
        const raw = ev.target.closest("button")?.dataset.send;
        if (raw) window.__shim.send(...JSON.parse(raw));
      });
    </script>
    <script type="module" src="/dev/shim.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
