<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="stage" data-state="idle" data-theme="dark">
      <section id="stack" class="stack-inline" aria-label="Waiting for you" hidden></section>
      <section id="live" class="live-inline" aria-label="Live views" hidden></section>
      <ul id="rows" class="deck" aria-label="Other requests" aria-live="polite" hidden></ul>
      <section id="card" class="card" aria-live="polite"></section>
      <div id="capsule" class="capsule" data-p="idle" role="status" aria-live="polite">
        <span class="orb" aria-hidden="true"></span>
        <span class="cap-ring" aria-hidden="true"></span>
        <span class="spinner spinner--big cap-spin" aria-hidden="true"></span>
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="cap-text"><span id="cap-label" class="cap-label"></span><span id="cap-sub" class="cap-sub"></span></span>
        <button id="cap-btn" class="btn btn--ghost cap-btn" hidden></button>
      </div>
    </main>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
