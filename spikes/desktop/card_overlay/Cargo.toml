[package]
name = "card-overlay-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Stands alone: a spike, never part of the overlay's build or tests.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
# Already in Tauri's own tree at this version: used to ask Windows where a control is.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Shell"] }
