[project]
name = "swift-agent"
version = "0.1.0"
description = "Swift: a passive, voice-activated desktop agent for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pip-licenses>=5",
]
# Phase 0 spikes only (§17). Never imported by src/swift.
spikes = [
    "numpy>=1.26",
    "psutil>=6",
    "faster-whisper>=1.2",
    "piper-tts>=1.3",
    "ollama>=0.6",
    "sounddevice>=0.5",
    "keyring>=25",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "replay: WAV corpus replay; needs models",
    "live_llm: needs a running Ollama on the owner machine",
    "windows: Windows integration tests",
    "hw: live microphone/speaker on the target machine (owner-run)",
    "google: needs Google test-account credentials (owner-run)",
]

[tool.uv]
required-version = ">=0.5"
