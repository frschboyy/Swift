<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift B4 prototype (dev only)</title>
    <!-- B4 study (docs/design/b4-adaptive-results.md): ?shape=compare|diagram|bad&theme=light. Not the overlay. -->
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/look/halo.css" />
    <style>
      body { background: #3a5f7d linear-gradient(135deg, #d9dee6, #5b7a99); margin: 0; min-height: 100vh; }
      #stage { position: relative; min-height: 100vh; }
      #stage .card.b4-card { position: absolute; top: 24px; left: 24px; right: auto; bottom: auto; opacity: 1; transform: none; visibility: visible; }
      .b4-say { margin: 0 0 10px; font-size: 17px; line-height: 1.45; }
      .b4-said { font-size: 12px; color: var(--faint); margin: 0 0 8px; }
      .b4-compare { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
      .b4-compare th, .b4-compare td { padding: 7px 10px 7px 0; text-align: left; vertical-align: top; border-top: 1px solid var(--rim); }
      .b4-compare thead th { border-top: none; font-weight: 600; font-size: 13px; color: var(--text); }
      .b4-compare tbody th { color: var(--muted); font-weight: 500; white-space: nowrap; width: 1%; }
      .b4-compare td { font-variant-numeric: tabular-nums; }
      .b4-compare .b4-pick { background: var(--accent-soft); padding-left: 8px; }
      .b4-compare thead .b4-pick { border-radius: 10px 10px 0 0; }
      .b4-tag { display: block; font-size: 11px; font-weight: 600; color: var(--accent); }
      .b4-diagram { display: block; margin: 4px auto 0; overflow: visible; }
      .b4-node { fill: var(--raise); stroke: var(--accent-edge); stroke-width: 1; }
      .b4-node-label { fill: var(--text); font: 600 13px system-ui, sans-serif; }
      .b4-edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
      .b4-edge--back { stroke-dasharray: 4 3; }
      .b4-arrowhead { fill: var(--muted); }
      /* Mind map: root, then branches to its right; each branch's ideas beside it, deeper ones indented below. */
      .b4-mind { display: flex; align-items: center; gap: 0; font-size: 13px; line-height: 18px; margin-top: 4px; }
      .b4-mind ul { list-style: none; margin: 0; padding: 0 0 0 16px; position: relative; }
      .b4-mind li { position: relative; padding: 3px 0; }
      .b4-mind li::before { content: ""; position: absolute; left: -10px; top: 0; bottom: 0; border-left: 1.4px solid var(--accent-edge); }
      .b4-mind li:first-child::before { top: 13px; }
      .b4-mind li:last-child::before { bottom: auto; height: 13px; }
      .b4-mind li:only-child::before { display: none; }
      .b4-mind li::after { content: ""; position: absolute; left: -10px; top: 13px; width: 10px; border-top: 1.4px solid var(--accent-edge); }
      .b4-mind > ul::before, .b4-mind-l1 > li > ul::before { content: ""; position: absolute; left: 0; top: 50%; width: 6px; border-top: 1.4px solid var(--accent-edge); }
      .b4-mind-l1 > li { display: flex; align-items: center; }
      /* A branch sits at the middle of its ideas, so its lines meet it there, not at the top. */
      .b4-mind-l1 > li::after { top: 50%; }
      .b4-mind-l1 > li:first-child::before { top: 50%; }
      .b4-mind-l1 > li:last-child::before { height: 50%; }
      .b4-mind-node { display: inline-block; padding: 1px 8px; border-radius: 8px; color: var(--text); }
      .b4-mind-root { flex: 0 0 auto; max-width: 104px; padding: 8px 10px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-align: center; }
      .b4-mind-l1 > li > .b4-mind-node { flex: 0 0 auto; max-width: 96px; background: var(--accent-soft); border: 1px solid var(--accent-edge); font-weight: 600; padding: 4px 8px; }
      .b4-mind-l2 > li > .b4-mind-node { background: var(--raise); }
      .b4-mind-l3 { padding-left: 14px; }
      .b4-mind-l3 .b4-mind-node { color: var(--muted); padding: 0 6px; }
      .b4-mermaid { display: block; max-width: 100%; height: auto; max-height: 420px; margin: 4px auto 0; }
      .b4-edge-label { fill: var(--faint); font: 12px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main id="stage" data-look="halo" data-theme="dark" data-state="idle"></main>
    <script type="module" src="./b4/page.ts"></script>
  </body>
</html>
