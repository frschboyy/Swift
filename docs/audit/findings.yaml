- id: HA-FAKE-01
  title: Google errors are matched by searching their whole text for "404" or "401", and that text includes the
    request address (draft id, event id, search words). So a passing outage can make Swift report an email as sent
    or an event as removed when neither happened, or offer a new sign-in that isn't needed.
  source: health audit 2026-11-12
  module: src/swift/connectors/gmail.py, src/swift/connectors/google_calendar.py, src/swift/connectors/google.py
  area: actions
  severity: high
  product_rule: false
  status: open
  confidence: confirmed
  evidence: 'gmail.py:140 (send: "404" means sent) and gmail.py:155 ("404" in str(exc) in _draft_exists); google_calendar.py:144
    (_get) with google_calendar.py:200-201 (delete_event: tried and None means "removed"); google.py:212 ("401"
    in text). googleapiclient HttpError.__str__ is its __repr__: ''<HttpError 503 when requesting <uri> returned
    ...>'' (checked in the installed package). Gmail draft ids are long numbers and Swift''s event ids are uuid
    hex, so some contain "404". The suite''s fakes raise "<HttpError 404 Not Found>" or "HttpError 503" with no
    address, so these tests pass falsely: test_audit_2026_10.py::test_an_email_is_sent_once_when_the_connection_drops,
    test_google_contacts.py::test_a_delete_whose_connection_dropped_is_done_on_the_retry, test_google_contacts.py::test_a_refusal_is_not_retried_or_called_a_refusal.'
  test: tests/unit/test_health_FAKE.py::test_an_email_not_sent_is_never_reported_sent
  note: Also tests/unit/test_health_FAKE.py::test_an_event_still_there_is_never_reported_removed and ::test_a_refusal_is_not_an_expired_sign_in.
    Seams audit X-14 noted the "401" match as loose (Low); the "404" cases are new and turn an outage into a false
    "sent"/"removed". A faithful fake raises an HttpError-shaped error carrying resp.status and the uri; the fix
    reads resp.status, not the text.
- id: HA-FAKE-03
  title: 'Pressing Esc while a request waits for the warm Claude Code CLI to finish connecting (up to 20 s) is swallowed:
    the request starts anyway, cold, and Esc doesn''t stop it.'
  source: health audit 2026-11-12
  module: src/swift/executors/claude_code.py
  area: actions
  severity: high
  product_rule: false
  status: open
  confidence: confirmed
  evidence: 'claude_code.py:421-425: `except (asyncio.CancelledError, Exception)` around `asyncio.wait_for(task,
    SPARE_WAIT_S)` catches the caller''s own cancellation, returns None, and start() goes on to create the run (claude_code.py:538-542).
    Session.cancel (session.py:1727-1735) cancels the interaction task and awaits it. MockExecutor.start and EchoExecutor.start
    return at once, and the prewarm fakes connect at once, so no test cancels during start: test_executor_contract.py::test_cancel_mid_run_ends_events_and_reports_cancelled,
    test_claude_prewarm.py (all).'
  test: tests/unit/test_health_FAKE.py::test_cancel_while_waiting_for_the_warm_cli_stops_the_start
  note: 'Reproduced at the executor. At the session (Esc waits for the whole run because the task never sees its
    cancel) it is read in the code, not run. A faithful fake: a provider whose start() awaits something slow. Not
    the same as X-12 (that wait now has SPARE_WAIT_S).'
- id: HA-UI-01
  title: While a request is working or a card waits, Esc pressed in any other app never reaches that app and cancels
    Swift's request instead.
  source: health audit 2026-11-12
  module: overlay/src/main.ts, overlay/src-tauri/src/lib.rs
  area: actions
  severity: high
  product_rule: false
  status: open
  confidence: suspected
  evidence: main.ts:1979 syncEscape grabs Esc whenever ACTIVE.has(stageNow()) (listening, transcribing, working,
    confirm); lib.rs:285-296 set_escape uses RegisterHotKey, which takes the key from every app; main.ts:1990-1992
    onEscape then sends {type:"cancel"} while active.
  test: null
  note: The code path is clear; not run on the real system. A background run can take minutes, so pressing Esc in
    an editor, a dialog or a browser during it stops the run (a Word write mid-way, a waiting card). A low-level
    keyboard hook that passes Esc on, or grabbing Esc only while the overlay has the pointer or Swift is speaking
    or listening, would avoid it.
