<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="stage" data-state="idle">
      <section id="card" class="card" aria-live="polite"></section>
      <ul id="rows" class="rows" aria-label="Other requests" hidden></ul>
      <section id="stack" class="stack-inline" aria-label="Waiting for you" hidden></section>
      <div id="voice" class="voice">
        <div id="orb" class="orb"><div class="orb-core"></div><div class="orb-ring"></div></div>
        <p id="transcript" class="transcript"></p>
      </div>
      <div id="heard" class="heard" role="status" aria-live="polite">
        <span class="heard-dot" aria-hidden="true"></span><span id="heard-text"></span>
      </div>
    </main>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
