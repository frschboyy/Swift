- id: HA-SYS-02
  title: An alarm or reminder at a clock time, set before a daylight-saving change, rings an hour late or early.
  source: health audit 2026-11-12
  module: src/swift/system/lane.py, src/swift/system/intents.py
  area: timers
  severity: medium
  product_rule: false
  status: open
  confidence: confirmed
  evidence: 'lane.py:89 default now = datetime.now().astimezone(), a fixed-offset tz; intents.resolve (intents.py:209-212)
    adds days and replaces the hour in that fixed offset, so 07:00 tomorrow is stored as 07:00+00:00 = 08:00 BST.
    Repro: due 1806217200 vs wanted 1806213600 (one hour).'
  test: tests/unit/test_health_SYS.py::test_alarm_across_dst_rings_at_the_wall_clock_time
  note: Affects 'tomorrow', weekday and 'tonight'-across-the-change alarms twice a year. Timers ('in 10 minutes')
    are fine (epoch seconds). Fix needs the local zone (tzdata is not installed; Windows' own zone via time.localtime/mktime
    would do).
- id: HA-SYS-03
  title: A question naming a switch with on/off ('Bluetooth on?', 'Wi-Fi on?', 'dark mode on?') is parsed as turning
    it on and done with no card.
  source: health audit 2026-11-12
  module: src/swift/system/intents.py
  area: routing
  severity: medium
  product_rule: false
  status: open
  confidence: confirmed
  evidence: fast.normalize strips '?' (routing/fast.py:96), then _RADIO_SWITCH form 4 '{radio} (back )?(on|off)'
    (intents.py:586) and _THEME form 4 (intents.py:414) match. Turning a radio on is not disruptive (intents.py:632-633),
    so lane.start runs it at once. 'is wifi on' correctly gives radio.get. 'wifi off?' asks first (disruptive),
    so only the 'on' side acts unasked.
  test: tests/unit/test_health_SYS.py::test_bluetooth_question_changes_nothing
  note: Bluetooth on makes the PC discoverable, which system_tools.from_answer treats as needing care. The question
    mark is lost before the grammar sees it; the lane would need the raw text or a flag from normalize.
- id: HA-SYS-05
  title: '''Undo that'' after an action with nothing to undo (next track, lock, a window, a reading) reverses an
    older change from up to 10 minutes before.'
  source: health audit 2026-11-12
  module: src/swift/system/lane.py
  area: actions
  severity: medium
  product_rule: false
  status: open
  confidence: confirmed
  evidence: 'lane.py:206-207 replaces _undo only when the new utterance produced an undo; otherwise the old one
    stays live for UNDO_S=600 (lane.py:47, 210-211). Session routes ''undo'' to the lane when can_undo() (session.py:2848).
    Repro: volume to 20, then ''skip this song'', can_undo() still True.'
  test: tests/unit/test_health_SYS.py::test_undo_follows_the_last_action_not_an_older_one
  note: The same happens after a failed change and after 'X didn't switch' (no undo). Clearing _undo on every executed
    change fixes it.
- id: HA-SYS-06
  title: One schedule.json row with a bad 'due' (null or text) loads, then kills Scheduler.run, and no timer, alarm
    or reminder fires again until restart, with no log or card.
  source: health audit 2026-11-12
  module: src/swift/system/scheduler.py, src/swift/backend/__main__.py
  area: timers
  severity: medium
  product_rule: false
  status: open
  confidence: confirmed
  evidence: scheduler.py:164 builds Item(**row) with no type check (only kind is checked); due() compares i.due
    <= now (scheduler.py:125) -> TypeError outside the on_fire try (scheduler.py:131-139). The task is create_task'd
    with no done callback (__main__.py:251) and only cancelled at exit (__main__.py:554-555). pending() also raises,
    so 'list my timers' fails as 'Something went wrong'.
  test: tests/unit/test_health_SYS.py::test_a_bad_due_row_does_not_kill_the_clock
  note: 'Needs a hand-edited or partly written file (atomic replace makes the latter unlikely). Same class: a row
    whose id is text. The ''bad rows set aside'' path (B-03 era) misses wrong types.'
- id: HA-SYS-07
  title: A failed read of schedule.json (file briefly locked) moves the whole file to .bad and starts empty, so
    every pending alarm and reminder is lost; a second time overwrites the earlier .bad.
  source: health audit 2026-11-12
  module: src/swift/system/scheduler.py
  area: timers
  severity: medium
  product_rule: false
  status: open
  confidence: confirmed
  evidence: 'scheduler.py:156-169: OSError on read leaves rows=None, then ''not isinstance(rows, list)'' sets the
    file aside with os.replace (overwriting any existing .bad) and items stay []; the next add/save writes a fresh
    file without them. Nothing reads .bad back.'
  test: tests/unit/test_health_SYS.py::test_a_transient_read_error_keeps_the_schedule
  note: Antivirus/backup/indexer locks on Windows are the plausible trigger; unproven how often. Only set aside
    on a parse error, not on OSError.
