# Owner checks ledger: what each check proves, and every result it has had.
#
# Read by spikes/owner_checks/plan.py, which works out from this file and git what to run next and
# writes it into owner-checks.md. tests/unit/test_owner_plan.py keeps it honest: every check in
# owner-checks.md is in an area, every path matches a file, every result names a real check.
#
# areas:  code a group of checks proves. When a commit touches a path here (or names the check, or a
#         finding the check names, in its message), a pass on that check goes stale.
#         `rule` marks a product rule from CLAUDE.md: those checks rank first.
#         Check lists take numbers, ids like 2b, and ranges like 43-48 (a range takes 19b too).
# focus:  checks someone asked to run soon, with why (an ADR's gate, a session's finding). They rank
#         higher until they pass. Remove an entry once its question is answered.
# ignore: code paths no area should own, with the reason.
# runs:   one entry per owner run or decision, newest last. plan.py --record and --set append here.
#         commit: main when the run started (from its time), so approximate when Swift wasn't restarted.
#         PASS, FAIL: a verdict. A report's LOOK lines are never recorded: only the owner's word settles those.
#         PARTIAL: some of the check's report lines passed; others weren't seen, or need the owner's eyes.
#         RETIRED, BLOCKED: the check no longer applies, or can't run until something else is done.

