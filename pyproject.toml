[project]
name = "swift-agent"
version = "0.1.0"
description = "Swift: a passive, voice-activated desktop agent for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pip-licenses>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "replay: WAV corpus replay; needs models",
    "live_llm: needs a running Ollama on the owner machine",
    "windows: Windows integration tests",
    "hw: live microphone/speaker on the target machine (owner-run)",
    "google: needs Google test-account credentials (owner-run)",
]

[tool.uv]
required-version = ">=0.5"
