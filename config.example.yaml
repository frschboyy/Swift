# Swift MVP configuration. Copy to config.yaml (gitignored) and edit.
# No secrets belong here: Claude Code uses its own login.

hotkeys:
  push_to_talk: "Ctrl+Shift+Space" # hold to talk, release to stop
  debug: "Ctrl+Alt+F12"            # cycles MockExecutor scenarios when debug: true
  type: "Ctrl+Alt+Space"           # opens a text box: type a request instead of saying it ("" turns it off)

audio:
  preroll_s: 0                     # >0 keeps the mic open and prepends this much audio from before the key-down
                                   # (try 0.5). Windows then shows the mic-in-use indicator whenever Swift runs.
  chime: true                      # a short soft chime the moment Swift hears "hey Swift" or the hotkey

wake:                              # start by voice: "hey / hello / good afternoon Swift" (swift/wake.py)
  enabled: false                   # on keeps the mic open (Windows' mic indicator stays on) and
                                   # transcribes each short utterance locally to look for the phrase
  greetings: []                    # extra greetings to accept, e.g. ["wakey wakey", "wake up"]
  min_p: 0.5                       # ignore a phrase the model was this unsure of; 0 = off
  end_silence_s: 0.9               # after a bare "hey Swift", the request ends this long after you stop
  start_timeout_s: 5               # ...and Swift stops listening if you say nothing for this long
  followup_s: 8                    # after an answer, reply without "hey Swift" for this long; 0 = off
                                   # during a run "show me", "stop", "reject" work without it; approving needs "Swift, approve"
  followup_min_p: 0.7              # a reply in that window must be this sure, and sound like you, not the room;
                                   # said less surely, Swift asks you to say it again instead of guessing

stt:
  engine: "parakeet"               # "parakeet" (fast, accurate) or "whisper"
  cpu_threads: 4
  # Whisper only: model, beam_size, initial_prompt
  model: "small.en"                # or "base.en" (faster, less accurate)
  beam_size: 5                     # 1 is fastest; 5 is more accurate
  # Names and jargon you say often. Whisper follows its spelling and style.
  initial_prompt: "Swift, Claude Code, README, PLAN.md, config.yaml, Python, Rust, Tauri, TypeScript, pytest, git commit."
  # Phrases the model mishears -> what you meant. Both engines. Learned fixes
  # (spikes/stt/learn_fixes.py) live in word_fixes_file; these win over them.
  word_fixes: {}
  word_fixes_file: "%LOCALAPPDATA%/Swift/word_fixes.json"
  # Noise checks, Parakeet only (docs/stt-noise.md). Words heard with less than
  # unclear_p probability are named to the agent so it asks instead of guessing;
  # a transcript averaging below reject_p isn't acted on. 0 turns a check off.
  unclear_p: 0.4
  reject_p: 0.7
  # Approving by voice in a noisy room (between words louder than noisy_db dBFS) takes a
  # second "approve" or a click. Rejecting never waits.
  noisy_db: -50
  save_audio: false                # debug: keep each recording as a WAV in audio_dir
  audio_dir: "%LOCALAPPDATA%/Swift/audio"

executor:
  kind: "echo"                     # "claude_code" runs Claude Code; "echo" only shows the transcript; "mock" plays fake steps
  allowed_tools: ["Read", "Glob", "Grep"]   # run without asking (keep read-only)
  confirm_tools: ["Edit", "Write", "Bash"]  # each call asks on the overlay first; anything else doesn't exist
  working_dirs: []                 # e.g. ["C:/Users/me/Projects/thesis"]; trusted folders only
  read_dirs: ["%USERPROFILE%/Documents", "%USERPROFILE%/Downloads"]  # read without a card (plus working_dirs); elsewhere a card
  never_read: []                   # never read, even with a card (on top of keys, sign-ins, browser profiles)
  default_dir: 0
  max_budget_usd: 1.0
  confirm_timeout_s: 120
  prewarm: true                    # keep one Claude Code started and waiting (saves 5-13 s per request)
  quick_answers: true              # quick facts and wording: one tool-free call to the light model (ADR-007 §10)
  models:                          # starting model by how demanding a request looks (ADR-007)
    light: "claude-haiku-5-5"      # questions, lookups, short drafts, single commands
    standard: "claude-sonnet-5-5"  # changes, investigations; also when unsure
    strong: "claude-opus-5-5"      # only by escalation or "use opus ..."
  escalation: true                 # move up mid-request when Claude asks or keeps struggling
  confirm_strong: false            # ask on the overlay before switching to the strong model
  turn_limits: {light: 8, standard: 25}  # steps on one model before Swift moves the run up
  web: true                        # web search and fetch for ordinary requests (read-only, no card)

local:                             # "open ..." handled by Swift, by spoken name only (ADR-007)
  enabled: true
  editor: "vs code"                # app a project opens in unless you say "in Chrome" etc.
  # apps defaults to VS Code, Chrome, Notepad, Explorer; setting it replaces that list.
  # apps: {"vs code": "code", "chrome": "chrome"}
  folders: {}                      # e.g. {"lecture notes": "C:/Users/me/Documents/Lectures"}; Documents, Downloads, Desktop are built in
  projects: {}                     # e.g. {"thesis": "C:/Users/me/Projects/thesis"}; executor.working_dirs are added by folder name

logging:
  interactions: "%LOCALAPPDATA%/Swift/interactions.jsonl"
  app_log_dir: "%LOCALAPPDATA%/Swift/logs"
  journal: "%LOCALAPPDATA%/Swift/journal.jsonl"   # every sent email, before and after (metadata only)
  level: "INFO"

connectors:                        # Swift's own workflow tools (ADR-010)
  email: none                      # none | fake | gmail. gmail: sign in first (docs/google_setup.md). debug: true always uses fake
  calendar: none                   # none | fake | google. google shares the Gmail sign-in; sign in again once for calendar.events

workflows:                         # ADR-011 W1: built-in ones ship with Swift ("what workflows do I have?")
  enabled: true
  dir: "%APPDATA%/Swift/workflows" # your own: one folder each, SKILL.md + swift.yaml

desktop:                           # ADR-012 D1-D2: "this", "here", "open this", writing where you are, "undo that"
  enabled: true                    # read when you speak, never stored; password managers, banks, private windows never read
  never_read_apps: []              # more apps never to look at, e.g. ["Signal.exe"]
  never_read_titles: []            # more window-title words, e.g. ["payroll"]
system:                            # ADR-016 A1: timers, alarms, reminders, volume, theme, lock... done by Swift, no model
  enabled: true                    # false sends all of those to the agent as before. Never sleeps, restarts or shuts down
  schedule_file: "%LOCALAPPDATA%/Swift/schedule.json"  # timers and reminders survive a restart
  chime: true                      # a short sound when one comes due
speech:                            # ADR-016 B: Swift says its answers, in short (the card shows everything)
  enabled: true
  replies: auto                    # auto: spoken requests get a spoken answer | always | never
  voice: ""                        # a Windows voice: "Mark", "Zira", "David"; empty = the Windows default
  rate: 0                          # -10 (slow) .. 10 (fast)
  volume: 100
contacts: []                       # who Swift may email; "my lecturer" finds them by alias. Addresses never come from speech alone
  # - name: "Dr Ada Lovelace"
  #   email: "ada.lovelace@example.edu"
  #   aliases: ["lecturer"]
owner_name: ""                     # how your emails end ("Regards, <name>"); empty = the name on your Google account

routing: true                      # stop/cancel/repeat and time/date handled by Swift; the rest by demand
followup_context_s: 300            # a request this soon after the last answer sees it ("now commit it"); 0 = off

demand_classifier:                 # local classifier picks Haiku vs Sonnet where keywords can't (ADR-007 §4)
  enabled: false                   # off until it stops under-estimating (ADR-007 step 3); needs the bge-small model (README)
  threshold: 0.7                   # how sure it must be that a request is light

debug: true
