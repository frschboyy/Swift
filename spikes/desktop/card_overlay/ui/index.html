<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #card {
    position: absolute; transform-origin: 0 0; opacity: 0; box-sizing: border-box;
    background: #20282f; border-radius: 12px; box-shadow: 0 8px 30px #0008;
    will-change: transform, opacity;
  }
  #card.waiting { border: 2px solid var(--accent, #ffb060); }  /* a card that is waiting on an answer */
  /* A mark drawn over a control in someone else's window. */
  #ring {
    position: absolute; box-sizing: border-box; border: 2px solid var(--accent, #ffb060); border-radius: 8px;
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent, #ffb060) 60%, transparent);
    opacity: 0; transition: opacity .08s;
  }
  #line { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .08s; }
  #line line { stroke: var(--accent, #ffb060); stroke-width: 2; stroke-linecap: round; }
  /* Leaves quickly and without moving, so hiding is quiet; arrives a little slower. */
  #ring.on, #line.on { opacity: 1; transition: opacity .2s; }
  /* Probes (src/probes.rs). */
  #dim { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity .25s; }
  #dim.on { opacity: .35; }
  #glue { position: absolute; left: 0; top: 0; background: var(--accent, #ffb060); border-radius: 3px; opacity: 0; }
  #pill {
    position: absolute; background: #20282f; border-radius: 18px; box-shadow: 0 4px 16px #0008; opacity: 0;
    transition: transform .22s cubic-bezier(.3, 1.5, .5, 1), left .25s, top .25s, opacity .2s;
  }
  #pill::after {
    content: ''; position: absolute; left: 14px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
    border-radius: 50%; background: var(--accent, #ffb060);
  }
  #pill.on { opacity: 1; }
</style>
<div id="dim"></div>
<div id="glue"></div>
<div id="pill"></div>
<svg id="line"><line /></svg>
<div id="ring"></div>
<div id="card"></div>
<script>
  const card = document.getElementById('card');
  const out2 = u => 1 - (1 - u) ** 2;
  const px = r => r.map(v => v / devicePixelRatio);  // Rust speaks device pixels
  let open = null;

  function place([x, y, w, h], opacity) {
    card.getAnimations().forEach(a => a.cancel());
    Object.assign(card.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', opacity });
  }

  // Move from wherever the card is now, even mid-motion, so nothing ever jumps.
  function moveTo(rect, opacity, ms, easing = 'cubic-bezier(.33, 1, .68, 1)') {
    const b = card.getBoundingClientRect(), from = getComputedStyle(card).opacity, [x, y, w, h] = rect;
    place(rect, opacity);
    card.animate([
      { transform: `translate(${b.x - x}px, ${b.y - y}px) scale(${b.width / w}, ${b.height / h})`, opacity: from },
      { transform: 'none', opacity },
    ], { duration: ms, easing });
  }

  // Rust calls this when the desktop changes: lift, re-settle, go home, come back.
  function fly(rect, opacity, ms, easing) { moveTo(px(rect), opacity, ms, easing); }

  // a: {kind, waiting, src, dst, grow, approach, push}, times in ms. null puts the open card back.
  function go(a, sent) {
    const back = !a;
    a = a || open;
    open = back ? null : a;
    card.classList.toggle('waiting', !!a.waiting);
    // Drop 4: a card that takes its colour from what is underneath it.
    if (a.tint) card.style.background = `color-mix(in srgb, ${a.tint} 65%, #20282f)`;
    else if (a.kind !== 'tint') card.style.background = '';
    const src = px(a.src), dst = px(a.dst), dw = dst[2];
    requestAnimationFrame(() => {
      if (a.kind !== 'push') {
        if (back) moveTo(src, 0, a.grow);
        else { place(src, 0); moveTo(dst, 1, a.grow); }
      } else {  // dst is where the card ends: the strip the window gives up
        const total = back ? a.push : a.approach + a.push;
        const at = t => {
          if (back) { const u = t / a.push; return [-dw * out2(u), 1 - u]; }
          if (t < a.approach) { const n = (t / a.approach) ** 2; return [-dw - 0.5 * dw * (1 - n), n]; }
          return [-dw + dw * out2((t - a.approach) / a.push), 1];
        };
        // Sampled keyframes, so the webview's compositor runs the exact curve Rust runs.
        const n = Math.ceil(total / 8);
        place(dst, 0);
        card.animate(Array.from({ length: n + 1 }, (_, i) => {
          const [x, opacity] = at(i / n * total);
          return { transform: `translateX(${x}px)`, opacity };
        }), { duration: total, fill: 'forwards' });
      }
      window.__TAURI__.core.invoke('started', { sent });  // Rust starts the real window on this
    });
  }

  // Ring a control and tie a card to it. r: the control, c: the card, in device pixels.
  const ring = document.getElementById('ring'), line = document.getElementById('line');
  function mark(r, c) {
    const [x, y, w, h] = px(r), cr = px(c), pad = 4;
    Object.assign(ring.style, { left: x - pad + 'px', top: y - pad + 'px', width: w + 2 * pad + 'px', height: h + 2 * pad + 'px' });
    // From the card's centre (hidden under the card) to the nearest point on the ring.
    const cx = cr[0] + cr[2] / 2, cy = cr[1] + cr[3] / 2;
    const ex = Math.max(x - pad, Math.min(cx, x + w + pad)), ey = Math.max(y - pad, Math.min(cy, y + h + pad));
    const l = line.firstElementChild;
    l.setAttribute('x1', ex); l.setAttribute('y1', ey); l.setAttribute('x2', cx); l.setAttribute('y2', cy);
    ring.classList.add('on'); line.classList.add('on');
    card.classList.remove('waiting');
    place([ex, ey, 8, 8], 0);  // the card grows out of the ring
    moveTo(cr, 1, 220);
  }
  function unmark() {
    ring.classList.remove('on'); line.classList.remove('on');
    const b = card.getBoundingClientRect();
    moveTo([b.x, b.y, b.width, b.height], 0, 120);
  }

  // Probes (src/probes.rs).
  const box = (el, r) => { const [x, y, w, h] = px(r); Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); };
  const pillEl = document.getElementById('pill'), glueEl = document.getElementById('glue');
  function accent(c) { document.documentElement.style.setProperty('--accent', c); }
  function pill(on, r) { box(pillEl, r); pillEl.style.transform = 'none'; pillEl.classList.toggle('on', on); }
  function pillMove(r) { box(pillEl, r); }
  // nod: a quick look toward (dx, dy) and back. lean: hold it. rest: let go, with a small bounce.
  function pillReact(how, dx, dy) {
    const toward = k => `translate(${dx * k}px, ${dy * k}px) rotate(${dx * 4}deg)`;
    if (how === 'lean') pillEl.style.transform = toward(14);
    else if (how === 'rest') pillEl.style.transform = 'none';
    else {
      const now = getComputedStyle(pillEl).transform;
      pillEl.animate([{ transform: now }, { transform: toward(10) + ' scale(1.06)' }, { transform: now }], { duration: 320, easing: 'ease-out' });
    }
  }
  // Set straight from each move the window reports: no easing, so any trail is the real delay.
  function glue(r) {
    glueEl.style.opacity = r ? 1 : 0;
    if (r) { const [x, y, w, h] = px(r); Object.assign(glueEl.style, { width: w + 'px', height: h + 'px', transform: `translate(${x}px, ${y}px)` }); }
  }
  function dim(on) {
    document.getElementById('dim').classList.toggle('on', on);
    const r = [innerWidth / 2 - 180, innerHeight / 2 - 90, 360, 180];
    card.classList.remove('waiting');
    if (on) { place([r[0] + 150, r[1] + 80, 60, 20], 0); moveTo(r, 1, 260); } else moveTo(r, 0, 180);
  }

  // Selftest: where the card really is, in device pixels, and how visible.
  function probe() {
    const b = card.getBoundingClientRect(), d = devicePixelRatio;
    window.__TAURI__.core.invoke('probe', { v: [b.x * d, b.y * d, b.width * d, b.height * d, +getComputedStyle(card).opacity] });
  }
</script>
