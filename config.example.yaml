# Swift MVP configuration. Copy to config.yaml (gitignored) and edit.
# No secrets belong here: Claude Code uses its own login.

hotkeys:
  push_to_talk: "Ctrl+Shift+Space" # hold to talk, release to stop
  debug: "Ctrl+Alt+F12"            # cycles MockExecutor scenarios when debug: true

stt:
  engine: "parakeet"               # "parakeet" (fast, accurate) or "whisper"
  cpu_threads: 4
  # Whisper only: model, beam_size, initial_prompt
  model: "small.en"                # or "base.en" (faster, less accurate)
  beam_size: 5                     # 1 is fastest; 5 is more accurate
  # Names and jargon you say often. Whisper follows its spelling and style.
  initial_prompt: "Swift, Claude Code, README, PLAN.md, config.yaml, Python, Rust, Tauri, TypeScript, pytest, git commit."
  # Phrases the model mishears -> what you meant. Both engines. Learned fixes
  # (spikes/stt/learn_fixes.py) live in word_fixes_file; these win over them.
  word_fixes: {}
  word_fixes_file: "%LOCALAPPDATA%/Swift/word_fixes.json"
  save_audio: false                # debug: keep each recording as a WAV in audio_dir
  audio_dir: "%LOCALAPPDATA%/Swift/audio"

executor:
  kind: "echo"                     # "claude_code" runs Claude Code; "echo" only shows the transcript; "mock" plays fake steps
  allowed_tools: ["Read", "Glob", "Grep"]   # run without asking (keep read-only)
  confirm_tools: ["Edit", "Write", "Bash"]  # each call asks on the overlay first; anything else doesn't exist
  working_dirs: []                 # e.g. ["C:/Users/me/Projects/thesis"]; trusted folders only
  default_dir: 0
  max_budget_usd: 1.0
  confirm_timeout_s: 120

logging:
  interactions: "%LOCALAPPDATA%/Swift/interactions.jsonl"
  app_log_dir: "%LOCALAPPDATA%/Swift/logs"
  level: "INFO"

debug: true
